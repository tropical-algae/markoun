worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    # Preserve the client-facing scheme across an outer reverse proxy while
    # falling back to the scheme used for direct access.
    map $http_x_forwarded_proto $markoun_forwarded_proto {
        default $scheme;
        http    http;
        https   https;
    }

    gzip on; 
    gzip_static on; 
    gzip_proxied any;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 5;

    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        location / {
            root /app/web;
            index index.html index.htm;
            
            try_files $uri $uri/ /index.html;
        }

        location ^~ /_protected_media/ {
            internal;
            alias /markoun/data/;
            disable_symlinks on;
            add_header Cache-Control "private, no-cache";
            add_header X-Content-Type-Options "nosniff";
            etag on;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $markoun_forwarded_proto;
        }

        location = /mcp {
            proxy_pass http://127.0.0.1:8080/mcp/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 4m;

            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $markoun_forwarded_proto;
            proxy_set_header Connection "";
        }

        location ^~ /mcp/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 4m;

            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $markoun_forwarded_proto;
            proxy_set_header Connection "";
        }
    }
}
